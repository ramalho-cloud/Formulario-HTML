<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/style.css">
    <title>Formulário</title>
</head>
<body>
    <header>
        <h1>Academia de Heróis</h1>
        <p>Preencha para talves, se quiser muito, participar da proxima missão.</p>
    </header>
    <main>
        <section id="formulario">
        <section id="Inscricao">
        <h1>Faça sua inscrição!</h1>
        <form action="#" method="get">
            <label for="nome">Nome do herói:</label>
            <input id="Nome" name="Nome" type="text" required>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required>
            <label for="idade">Idade</label>
            <input id="idade" name="idade" type="number" required>

            <label for="equipe">Escolha a sua equipe!!</label>
            <select id="equipe" name="equipe" required>
                <option>Escolha sua equipe</option>
                <option>Liga de justiça</option>
                <option>Vingadores</option>
                <option>Guardiões de galáxia</option>
                <option>Jovens titãs</option>
            </select>
            </section>

            <section id="Poderes">
            <h3>Qual desses poderes você prefere?</h3>
            <label>Voar</label>
            <input id="voar" name="poderes" type="radio" required>
            <label>Super velocidade</label>
            <input id="supervelocidade" name="poderes" type="radio" required>
            <label>Super força</label>
            <input: id="superforca" name="poderes" type="radio" required>
            <label>Quero receber novas missões!</label>
            <input id="info" name="info" type="checkbox" required>
            </section>

            <section id="pergunta">
                <label>Por que quer se tornar um herói?</label>
                <textarea id="resposta" name="resposta" rows="4"></textarea>
            </section>

            <section id="enviar">
                <label>Enviar formulário</label>
                <input id="envio" name="envio" type="submit">
            </section>
        </section>
        </form>
         <footer>
            <p>Fomulários HTML</p>
        </footer>
    </main>
    
</body>
</html>
